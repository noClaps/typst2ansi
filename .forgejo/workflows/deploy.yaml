on: [push, workflow_dispatch]

jobs:
  deploy:
    runs-on: codeberg-small-lazy
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/taiki-e/install-action@wasm-bindgen
      - run: bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
      - run: make build-linux
      - uses: https://github.com/cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=typst2ansi
